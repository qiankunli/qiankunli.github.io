<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1410" viewBox="0 0 1600 1410" role="img" aria-labelledby="title desc">
<title id="title">机器人硬件互连：USB、CAN 与 Dynamixel 并列连接</title>
<desc id="desc">同一主控板中的 SoC 包含 CPU、DDR、USB、SPI 和 UART 控制器。USB 连接摄像头，SPI 经 CAN 控制器和收发器连接 CAN 关节，UART 经半双工接口电路连接 Dynamixel 舵机。两条关节总线并列、互不串接。图为通用方案对照，不代表 Microduck 完整硬件。</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#193546}.title{font-size:32px;font-weight:700}.heading{font-size:25px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#607885}.blue{fill:#2367b3}.purple{fill:#7955a9}
</style></defs>
<rect width="1600" height="1410" fill="white"/>
<text x="50" y="58" class="title" text-anchor="start">机器人硬件互连：同一主控板，连接不同类型的外设</text>
<text x="50" y="98" class="body" text-anchor="start">USB 摄像头、CAN 关节与 Dynamixel 舵机并列展示；按实际设备选择接口。</text>
<text x="50" y="131" class="small" text-anchor="start">连线表示双向数据 / 控制通信；电源与地省略。</text>
<rect x="50" y="160" width="1500" height="705" rx="24" fill="#f0f7f3" stroke="#77a597" stroke-width="2"/>
<text x="75" y="199" class="heading" text-anchor="start">机器人主控板 / PCB</text>
<rect x="80" y="225" width="1120" height="355" rx="18" fill="#e3eeff" stroke="#6992c5" stroke-width="2"/>
<text x="102" y="255" class="label" text-anchor="start">SoC：CPU、内存控制器与多种 I/O 控制器集成在同一颗芯片内</text>
<rect x="120" y="280" width="300" height="85" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="140" y="316" class="label" text-anchor="start">CPU 核心 / Cache</text>
<text x="140" y="346" class="small" text-anchor="start">运行 Linux 与机器人应用</text>
<rect x="650" y="280" width="270" height="85" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="670" y="316" class="label" text-anchor="start">DDR 内存控制器</text>
<text x="670" y="346" class="small" text-anchor="start">管理内存访问</text>
<path d="M420 322H650" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="535" y="309" class="small" text-anchor="middle">片上互连</text>
<rect x="1230" y="280" width="290" height="85" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="1250" y="316" class="label" text-anchor="start">DDR / LPDDR 内存</text>
<text x="1250" y="346" class="small" text-anchor="start">程序、图像、关节状态</text>
<path d="M920 322H1230" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="1198" y="306" class="small blue" text-anchor="middle">DDR</text>
<path d="M270 365V413H1030V465 M270 413V465 M650 413V465" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="525" y="402" class="small" text-anchor="start">片上互连</text>
<rect x="120" y="465" width="300" height="85" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="140" y="501" class="label" text-anchor="start">USB 主控制器</text>
<text x="140" y="532" class="small" text-anchor="start">连接 USB 外设</text>
<rect x="500" y="465" width="300" height="85" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="520" y="501" class="label" text-anchor="start">SPI 控制器</text>
<text x="520" y="532" class="small" text-anchor="start">连接外置 CAN 控制器</text>
<rect x="880" y="465" width="300" height="85" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="900" y="501" class="label" text-anchor="start">UART 控制器</text>
<text x="900" y="532" class="small" text-anchor="start">串行数据收发</text>
<text x="1210" y="437" class="small" text-anchor="start">现代 SoC 集成了</text>
<text x="1210" y="466" class="small" text-anchor="start">许多传统 PC 南桥、</text>
<text x="1210" y="495" class="small" text-anchor="start">北桥的功能。</text>
<rect x="120" y="665" width="300" height="85" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="140" y="703" class="label" text-anchor="start">USB 连接器</text>
<text x="140" y="732" class="small" text-anchor="start">摄像头的数据与配置</text>
<path d="M270 550V665" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="285" y="623" class="small blue" text-anchor="start">USB</text>
<rect x="500" y="615" width="300" height="80" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="520" y="648" class="label" text-anchor="start">外置 CAN 控制器</text>
<text x="520" y="678" class="small" text-anchor="start">组帧、过滤、仲裁等</text>
<path d="M650 550V615" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="670" y="598" class="small blue" text-anchor="start">SPI（中断线省略）</text>
<rect x="500" y="755" width="300" height="80" rx="12" fill="#fff" stroke="#77a597" stroke-width="2"/>
<text x="520" y="789" class="label" text-anchor="start">CAN 收发器</text>
<text x="520" y="819" class="small" text-anchor="start">逻辑信号 ↔ 差分电信号</text>
<path d="M650 695V755" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="670" y="735" class="small blue" text-anchor="start">TX / RX</text>
<rect x="950" y="665" width="480" height="100" rx="12" fill="#fff" stroke="#a791c1" stroke-width="2"/>
<text x="975" y="704" class="label" text-anchor="start">Dynamixel 半双工接口电路</text>
<text x="975" y="737" class="small" text-anchor="start">方向控制 + TTL 电平适配 / RS-485 收发器</text>
<path d="M1030 550V615H1190V665" fill="none" stroke="#7955a9" stroke-width="3" stroke-linejoin="round"/>
<text x="1210" y="637" class="small purple" text-anchor="start">UART TX / RX</text>
<path d="M270 750V975" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="95" y="920" class="small blue" text-anchor="start">USB 线缆</text>
<path d="M650 835V925 M550 925H860 M580 925V1025 M825 925V1025" fill="none" stroke="#2367b3" stroke-width="3" stroke-linejoin="round"/>
<text x="675" y="889" class="small blue" text-anchor="start">CAN_H / CAN_L</text>
<text x="675" y="913" class="small blue" text-anchor="start">共享 CAN 总线</text>
<path d="M1190 765V925 M1080 925H1435 M1120 925V1025 M1380 925V1025" fill="none" stroke="#7955a9" stroke-width="3" stroke-linejoin="round"/>
<text x="1210" y="889" class="small purple" text-anchor="start">Dynamixel 串行总线</text>
<text x="1210" y="913" class="small purple" text-anchor="start">协议报文按设备 ID 寻址</text>
<rect x="80" y="975" width="340" height="220" rx="18" fill="#fff9ee" stroke="#d7bc8e" stroke-width="2"/>
<text x="105" y="1015" class="heading" text-anchor="start">USB 摄像头</text>
<text x="105" y="1056" class="body" text-anchor="start">图像传感器 + 控制电路</text>
<text x="105" y="1093" class="small" text-anchor="start">图像帧 → 主控板</text>
<text x="105" y="1123" class="small" text-anchor="start">曝光等配置 ← 主控板</text>
<text x="105" y="1166" class="small" text-anchor="start">V4L2 / OpenCV</text>
<rect x="470" y="1025" width="220" height="225" rx="16" fill="#fff9ee" stroke="#d7bc8e" stroke-width="2"/>
<text x="580" y="1062" class="label" text-anchor="middle">CAN 关节 1</text>
<text x="580" y="1100" class="small" text-anchor="middle">CAN 接口 + MCU</text>
<text x="580" y="1130" class="body" text-anchor="middle">↓ 功率驱动</text>
<text x="580" y="1164" class="body" text-anchor="middle">↓ 电机 + 传动</text>
<text x="580" y="1202" class="small" text-anchor="middle">位置传感器 → MCU</text>
<text x="580" y="1231" class="small" text-anchor="middle">本地反馈闭环</text>
<rect x="715" y="1025" width="220" height="225" rx="16" fill="#fff9ee" stroke="#d7bc8e" stroke-width="2"/>
<text x="825" y="1062" class="label" text-anchor="middle">CAN 关节 2</text>
<text x="825" y="1100" class="small" text-anchor="middle">CAN 接口 + MCU</text>
<text x="825" y="1130" class="body" text-anchor="middle">↓ 功率驱动</text>
<text x="825" y="1164" class="body" text-anchor="middle">↓ 电机 + 传动</text>
<text x="825" y="1202" class="small" text-anchor="middle">位置传感器 → MCU</text>
<text x="825" y="1231" class="small" text-anchor="middle">本地反馈闭环</text>
<rect x="1010" y="1025" width="220" height="225" rx="16" fill="#fff9ee" stroke="#d7bc8e" stroke-width="2"/>
<text x="1120" y="1062" class="label" text-anchor="middle">Dynamixel · ID 1</text>
<text x="1120" y="1100" class="small" text-anchor="middle">串行接口 + MCU</text>
<text x="1120" y="1130" class="body" text-anchor="middle">↓ 功率驱动</text>
<text x="1120" y="1164" class="body" text-anchor="middle">↓ 电机 + 传动</text>
<text x="1120" y="1202" class="small" text-anchor="middle">位置传感器 → MCU</text>
<text x="1120" y="1231" class="small" text-anchor="middle">本地反馈闭环</text>
<rect x="1270" y="1025" width="220" height="225" rx="16" fill="#fff9ee" stroke="#d7bc8e" stroke-width="2"/>
<text x="1380" y="1062" class="label" text-anchor="middle">Dynamixel · ID 2</text>
<text x="1380" y="1100" class="small" text-anchor="middle">串行接口 + MCU</text>
<text x="1380" y="1130" class="body" text-anchor="middle">↓ 功率驱动</text>
<text x="1380" y="1164" class="body" text-anchor="middle">↓ 电机 + 传动</text>
<text x="1380" y="1202" class="small" text-anchor="middle">位置传感器 → MCU</text>
<text x="1380" y="1231" class="small" text-anchor="middle">本地反馈闭环</text>
<text x="80" y="1235" class="small" text-anchor="start">关节供电由电源电路提供。</text>
<path d="M50 1280H1550" fill="none" stroke="#cbd5df" stroke-width="3" stroke-linejoin="round"/>
<text x="60" y="1316" class="body" text-anchor="start">Dynamixel 也可通过 USB → U2D2 适配器接入；图中采用板载 UART 路径，与 CAN 并列。</text>
<text x="60" y="1350" class="small" text-anchor="start">TTL 与 RS-485 按型号选择，不可直接混接；两条关节链路独立，Dynamixel 不经过 CAN 控制器。</text>
<text x="60" y="1384" class="small" text-anchor="start">通用硬件互连示意，非 Microduck 完整电路 / PCB 布线图；每条关节总线仅画两个设备，实际可扩展。</text>
</svg>